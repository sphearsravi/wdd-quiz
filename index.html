<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Diabetes Day – Team Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E2466; --navy2:#173587; --blue:#4F8BFF; --blue2:#1E4FD8;
  --coral:#D9B23A; --coral2:#9C7414; --gold:linear-gradient(135deg,#FFF6D1 0%,#EBCB6A 25%,#C9A227 50%,#8F6A12 75%,#E8C867 100%); --goldv:linear-gradient(180deg,#FFF3C4 0%,#D9B23A 45%,#9C7414 100%); --off:#F4F6FA; --muted:#B9C6E6; --green:#39d98a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--navy);color:var(--off);font-family:'Inter',system-ui,sans-serif;overflow:hidden}
h1,h2,h3,.sora{font-family:'Sora',sans-serif}
#app{height:100%;display:flex;flex-direction:column;position:relative}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.bg{position:fixed;inset:0;background:radial-gradient(1200px 700px at 70% -10%,#2A52B8 0%,var(--navy) 60%,#081A4D 100%);z-index:-1}
.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 6% 92%,rgba(255,255,255,.08) 0 90px,transparent 91px),radial-gradient(circle at 94% 88%,rgba(201,162,39,.16) 0 120px,transparent 121px),radial-gradient(circle at 90% 12%,rgba(255,255,255,.06) 0 70px,transparent 71px),radial-gradient(circle at 10% 15%,rgba(201,162,39,.12) 0 60px,transparent 61px)}

/* scoreboard */
#score{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;gap:20px}
.team{display:flex;align-items:center;gap:14px;min-width:260px}
.team.right{flex-direction:row-reverse;text-align:right}
.team .dot{width:14px;height:14px;border-radius:50%}
.team .name{font-family:'Sora';font-weight:600;font-size:20px;letter-spacing:.3px}
.team .pts{font-family:'Sora';font-weight:800;font-size:44px;line-height:1;min-width:70px;text-align:center;transition:transform .2s}
.team .pts.pop{transform:scale(1.35)}
.t1 .pts,.t1 .dot{color:var(--blue);background:none}.t1 .dot{background:var(--blue)}
.t2 .pts,.t2 .dot{color:var(--coral)}.t2 .dot{background:var(--coral)}
#crumb{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:center}
#crumb b{display:block;color:var(--off);font-size:15px;letter-spacing:3px;margin-top:4px}

/* stage */
#stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;align-items:flex-start;justify-content:center;padding:10px 40px 20px;position:relative}
#stage>#view{margin:auto 0;width:100%;display:flex;justify-content:center}
#stage:has(#home){padding:0}
.screen{width:100%;max-width:1400px;animation:fade .45s ease both}
#view.noanim .screen,#view.noanim .take,#view.noanim .tag,#view.noanim .res{animation:none!important}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.kicker{letter-spacing:4px;text-transform:uppercase;color:var(--coral);font-weight:600;font-size:15px;margin-bottom:14px}
.q{font-size:48px;font-weight:800;line-height:1.1;margin-bottom:34px}
.q em{font-style:normal;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:clamp(10px,1.5vw,26px)}
.card{background:var(--navy2);border:2px solid #2B4FA8;border-radius:22px;padding:34px 30px;min-height:190px;display:flex;flex-direction:column;justify-content:center;position:relative;transition:all .5s cubic-bezier(.2,.8,.2,1)}
.card .letter{font-family:'Sora';font-weight:800;font-size:22px;color:var(--muted);margin-bottom:10px}
.card .label{font-family:'Sora';font-weight:600;font-size:30px;line-height:1.15}
.card .val{font-family:'Sora';font-weight:800;font-size:40px;margin-top:14px;opacity:0;transform:translateY(10px);transition:all .5s .3s}
.card.show .val{opacity:1;transform:none}
.card.win{border-color:var(--green);background:#0f3a35;box-shadow:0 0 0 6px rgba(57,217,138,.18),0 0 60px rgba(57,217,138,.35);transform:scale(1.04)}
.card.win .letter{color:var(--green)}
.card.dim{opacity:.45;transform:scale(.97)}
.card .picks{position:absolute;top:12px;right:14px;display:flex;gap:6px}
.pick{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.pick.p1{background:var(--blue)}.pick.p2{background:var(--coral);color:#3a2800}
.portion{color:var(--muted);margin-top:22px;font-size:17px}
.take{margin-top:26px;background:rgba(255,255,255,.08);border-left:4px solid #C9A227;padding:16px 20px;border-radius:10px;font-size:21px;line-height:1.4;animation:fade .6s .5s both}
.take small{display:block;color:var(--muted);font-size:14px;margin-top:8px;letter-spacing:1px;text-transform:uppercase}
.tag{display:inline-block;background:var(--coral);color:#3a2800;font-weight:800;font-family:'Sora';padding:6px 16px;border-radius:999px;font-size:18px;margin-bottom:16px;animation:fade .4s both}

/* timer */
#timer{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:84px;height:84px;z-index:5}
#timer circle{fill:none;stroke-width:7;stroke-linecap:round}
#timer .bgc{stroke:#2B4FA8}#timer .fg{stroke:var(--blue);transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear,stroke .3s}
#timer text{fill:var(--off);font-family:'Sora';font-weight:800;font-size:28px;text-anchor:middle;dominant-baseline:central}
#timer.hide{display:none}

/* host bar */
#host{flex:none;z-index:20;background:#0A1B4F;border-top:1px solid #2B4FA8;padding:12px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:14px}
#host .grp{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;background:#122C73}
#host .grp .lbl{font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;min-width:52px}
.g1 .lbl{color:var(--blue)}.g2 .lbl{color:var(--coral)}
button{font-family:'Inter';cursor:pointer;border:1px solid #3A62C4;background:#173587;color:var(--off);padding:8px 13px;border-radius:9px;font-size:14px;font-weight:600;transition:.15s}
button:hover{background:#2148A8}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.g2 button.on{background:var(--coral);border-color:var(--coral);color:#3a2800}
button.conf{font-size:12px;padding:7px 9px;opacity:.9}
button.big{background:var(--blue);border-color:var(--blue);color:#fff;padding:10px 20px;font-size:15px;font-family:'Sora';font-weight:700}
button.ghost{background:transparent}
#host .sp{flex:1}
#host .hint{color:var(--muted);font-size:12px}
#hostToggle{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:60;opacity:.35;font-size:11px;padding:4px 8px}
body.nohost #host{display:none}

/* intro / interstitial */
.center{text-align:center}
.circle{width:200px;height:200px;border-radius:50%;border:26px solid #FFFFFF;margin:0 auto 34px;box-shadow:0 0 80px rgba(45,156,255,.5),0 0 0 10px rgba(255,197,61,.35);animation:spin 1.2s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes spin{from{transform:scale(.2) rotate(-120deg);opacity:0}to{transform:none;opacity:1}}
.title{font-size:84px;font-weight:800;line-height:1;letter-spacing:-1px;background:linear-gradient(90deg,#F4F6FA 0%,#FFE08A 50%,#FFC53D 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:26px;color:var(--muted);margin-top:16px}
.names{display:flex;gap:28px;justify-content:center;margin-top:46px}
.names input{font-family:'Sora';font-size:26px;font-weight:600;background:var(--navy2);border:2px solid #2B4FA8;border-radius:14px;padding:14px 20px;color:var(--off);width:320px;text-align:center;outline:none}
.names input:focus{border-color:var(--blue)}
.names .n2:focus{border-color:var(--coral)}
.card.win{border-color:var(--coral)!important;background:#2a2410!important;box-shadow:0 0 0 6px rgba(255,197,61,.2),0 0 70px rgba(255,197,61,.45)!important}.card.win .letter{color:var(--coral)!important}
.rules{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;margin-top:40px;text-align:left}
.rule{background:var(--navy2);border-radius:18px;padding:26px}
.rule .num{font-family:'Sora';font-weight:800;color:var(--coral);font-size:34px}
.rule h3{font-size:22px;margin:8px 0 10px}
.rule p{color:var(--muted);font-size:17px;line-height:1.45}
.roundtitle{font-size:72px;font-weight:800}
.roundsub{font-size:28px;color:var(--muted);margin-top:14px}
.race{margin:50px auto 0;max-width:900px;display:flex;flex-direction:column;gap:22px}
.bar{display:flex;align-items:center;gap:18px;font-family:'Sora';font-weight:700;font-size:24px}
.bar .lab{width:200px;text-align:right}
.bar .track{flex:1;height:38px;background:#0A1B4F;border-radius:999px;overflow:hidden}
.bar .fill{height:100%;width:0;border-radius:999px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.bar.b1 .fill{background:linear-gradient(90deg,var(--blue2),var(--blue))}
.bar.b2 .fill{background:linear-gradient(90deg,var(--coral2),var(--coral))}
.bar .num{width:60px}
.mf{display:flex;gap:30px;justify-content:center;margin-top:30px}
.mf .card{min-width:0;flex:1;text-align:center}
.mf .card .label{font-size:44px;font-weight:800}
.winner{font-size:110px;font-weight:800;line-height:1;margin-top:20px;animation:zoom 1s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes zoom{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.winner.c1{color:var(--blue)}.winner.c2{color:var(--coral)}
.final{font-size:34px;color:var(--muted);margin-top:22px}
.homework{margin:40px auto 0;max-width:900px;background:var(--navy2);border-radius:18px;padding:24px 30px;font-size:24px;line-height:1.4}
.homework b{color:var(--coral)}
.drum{font-size:40px;color:var(--muted);letter-spacing:6px;text-transform:uppercase;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
.takeaways{text-align:left;max-width:1000px;margin:30px auto 0;display:grid;gap:16px}
.takeaways div{background:var(--navy2);border-radius:14px;padding:18px 22px;font-size:23px;display:flex;gap:18px;align-items:flex-start}
.takeaways b{color:var(--coral);font-family:'Sora';font-size:28px;line-height:1}

/* metallic gold shading */
.goldtext{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.t2 .pts{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent!important;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.t2 .dot{background:var(--goldv)!important;box-shadow:0 0 10px rgba(242,193,78,.6)}
.pick.p2{background:var(--goldv)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 3px rgba(0,0,0,.5)}
.g2 button.on{background:var(--goldv)!important;border-color:#8a5e05!important;color:#3a2800;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.tag{background:var(--goldv)!important;color:#3a2800!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 10px rgba(0,0,0,.4);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.card.win{border:2px solid transparent!important;background:linear-gradient(#2A3F8F,#1A2F7A) padding-box,var(--gold) border-box!important;box-shadow:0 0 0 4px rgba(217,178,58,.2),0 0 70px rgba(217,178,58,.5)!important}
.card.win .letter,.kicker,.rule .num,.takeaways b,.homework b{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.bar.b2 .fill{background:var(--goldv)!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.3)}
.bar.b2 .num{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.winner.c2{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 30px rgba(242,193,78,.5))}
.winner.c1{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) drop-shadow(0 0 30px rgba(45,156,255,.6))}
.circle{box-shadow:0 0 80px rgba(255,255,255,.35),0 0 0 10px #C9A227,0 0 0 13px #8F6A12,0 0 0 16px rgba(255,246,209,.6)!important}
.title{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.5))}
#score{border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--blue2),#D4A017,var(--blue2)) 1}

/* ===== HOME ===== */
#home{position:relative;width:100%;display:flex;align-items:center;justify-content:center}
.balloons,.sparks{position:fixed;left:0;right:0;top:76px;bottom:0;pointer-events:none;overflow:hidden;z-index:0}
body:not(.nohost) .balloons,body:not(.nohost) .sparks{bottom:66px}
.bl{position:absolute;bottom:-160px;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;animation:rise linear infinite;opacity:.9;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))}
.bl:before{content:"";position:absolute;left:18%;top:10%;width:28%;height:38%;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%)}
.bl:after{content:"";position:absolute;left:50%;top:100%;width:2px;height:120px;background:linear-gradient(rgba(255,255,255,.5),transparent);transform:translateX(-50%)}
.bl.b{background:radial-gradient(circle at 35% 30%,#4F8BFF,#1E3FA8 55%,#0A1B5C)}
.bl.g{background:radial-gradient(circle at 35% 30%,#FFF6D1,#E2BC45 40%,#B8860B 70%,#6E4F08)}
.bl.w{background:radial-gradient(circle at 35% 30%,#ffffff,#E6ECF8 55%,#AFC0E6)}
.bl.c{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,236,170,.75) 50%,rgba(201,162,39,.7));box-shadow:inset 0 0 20px rgba(201,162,39,.6)}
.bl.c i{position:absolute;width:9px;height:9px;border-radius:2px;background:#C9A227;transform:rotate(20deg)}
@keyframes rise{0%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-55vh) translateX(30px) rotate(5deg)}100%{transform:translateY(-130vh) translateX(-10px) rotate(-4deg)}}

.sp{position:absolute;width:6px;height:6px;background:#FFF6D1;border-radius:50%;box-shadow:0 0 10px 2px rgba(255,246,209,.8);animation:twinkle 2.6s ease-in-out infinite;opacity:0}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2)}}
.homein{position:relative;text-align:center;z-index:2}
.ring{position:relative;width:170px;height:170px;margin:0 auto 26px}
.ring .c0{position:absolute;inset:0;border-radius:50%;border:22px solid #fff;box-shadow:0 0 60px rgba(255,255,255,.4),0 0 0 8px #C9A227,0 0 0 11px #8F6A12;animation:spin 1.1s cubic-bezier(.2,.9,.3,1.25) both}
.ring .pulse{position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(201,162,39,.8);animation:pulseOut 2.2s ease-out infinite}
.ring .pulse.d{animation-delay:1.1s}
@keyframes pulseOut{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.9);opacity:0}}
.ring .orb{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6D1,#C9A227 60%,#8F6A12);top:50%;left:50%;margin:-9px;animation:orbit 4s linear infinite;box-shadow:0 0 12px rgba(201,162,39,.9)}
@keyframes orbit{from{transform:rotate(0) translateX(100px) rotate(0)}to{transform:rotate(360deg) translateX(100px) rotate(-360deg)}}
.eyebrow{letter-spacing:8px;text-transform:uppercase;font-size:16px;color:#FFF6D1;opacity:0;animation:fade .8s .5s both}
.ht{font-family:'Sora';font-weight:800;font-size:96px;line-height:1;letter-spacing:-1px;margin:10px 0 0;perspective:600px}
.ht span{display:inline-block;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45));opacity:0;animation:drop .7s cubic-bezier(.2,.9,.3,1.3) both}
.ht span.w{background:linear-gradient(180deg,#fff,#D7E0F7);-webkit-background-clip:text;background-clip:text}
.ht .gap{width:.3em}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotateX(70deg) scale(1.3)}to{opacity:1;transform:none}}
.shimmer{position:relative;display:inline-block}
.shimmer:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);background-size:250% 100%;mix-blend-mode:overlay;animation:sheen 3.2s 1.8s ease-in-out infinite;-webkit-mask:linear-gradient(#000,#000)}
@keyframes sheen{0%{background-position:150% 0}40%,100%{background-position:-150% 0}}
.hsub{font-size:26px;color:#D7E0F7;margin-top:18px;opacity:0;animation:fade .8s 1.5s both}
.hsub b{color:#FFF6D1;font-weight:600}
.vs{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:44px;opacity:0;animation:fade .8s 1.9s both}
.vs input{font-family:'Sora';font-size:26px;font-weight:700;background:rgba(10,27,79,.7);border:2px solid #2B4FA8;border-radius:16px;padding:16px 22px;color:#fff;width:330px;text-align:center;outline:none;transition:.25s;backdrop-filter:blur(6px)}
.vs input.i1:focus{border-color:#4F8BFF;box-shadow:0 0 30px rgba(79,139,255,.5)}
.vs input.i2{color:#FFF3C4}.vs input.i2:focus{border-color:#D9B23A;box-shadow:0 0 30px rgba(217,178,58,.5)}
.vs .badge{width:74px;height:74px;border-radius:50%;background:var(--goldv);display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;font-size:26px;color:#3a2800;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 0 30px rgba(217,178,58,.6);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.start{margin-top:40px;opacity:0;animation:fade .8s 2.3s both}
.start button{font-family:'Sora';font-weight:800;font-size:24px;padding:18px 56px;border-radius:999px;border:none;color:#3a2800;background:var(--goldv);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 10px 30px rgba(0,0,0,.4),0 0 40px rgba(217,178,58,.5);position:relative;overflow:hidden;transition:transform .2s}
.start button:hover{transform:translateY(-3px) scale(1.03)}
.start button:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);background-size:250% 100%;animation:sheen 2.4s ease-in-out infinite}
.start small{display:block;margin-top:14px;color:#B9C6E6;letter-spacing:2px;text-transform:uppercase;font-size:12px}


.revealbtn{display:flex;justify-content:center;margin-top:30px}
.revealbtn button{font-family:'Sora';font-weight:800;font-size:22px;padding:16px 48px;border-radius:999px;border:none;color:#3a2800;background:var(--goldv);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 8px 24px rgba(0,0,0,.4),0 0 36px rgba(217,178,58,.5);animation:beat 1.8s ease-in-out infinite;position:relative;overflow:hidden}
.revealbtn button:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);background-size:250% 100%;animation:sheen 2.4s ease-in-out infinite}
.revealbtn small{display:block;text-align:center;color:var(--muted);margin-top:8px;font-size:13px;letter-spacing:1px}


/* ===== team side panels ===== */
.qgrid{padding-top:clamp(64px,9vh,96px);display:grid;grid-template-columns:clamp(200px,17vw,310px) 1fr clamp(200px,17vw,310px);gap:clamp(36px,4.5vw,90px);align-items:start;width:100%;max-width:1600px}
.tp{border-radius:22px;padding:18px 16px 20px;background:rgba(10,27,79,.75);border:2px solid #2B4FA8;backdrop-filter:blur(6px)}
.tp.t1p{border-color:#4F8BFF;box-shadow:0 0 30px rgba(79,139,255,.25)}
.tp.t2p{border:2px solid transparent;background:linear-gradient(rgba(10,27,79,.9),rgba(10,27,79,.9)) padding-box,var(--gold) border-box;box-shadow:0 0 30px rgba(217,178,58,.3)}
.tp h3{font-family:'Sora';font-weight:800;font-size:30px;text-align:center;margin-bottom:14px;letter-spacing:.5px;line-height:1.1;word-break:break-word}
.t1p h3{color:#8FB8FF}.t2p h3{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.tp .ch{display:grid;gap:10px}
.tp .ch button{font-family:'Sora';font-weight:800;font-size:44px;padding:20px 10px;border-radius:16px;border:2px solid #3A62C4;background:#173587;color:#fff;letter-spacing:1px;transition:.15s}
.tp .ch button small{display:block;font-family:'Inter';font-weight:600;font-size:16px;letter-spacing:0;opacity:.75;margin-top:2px}
.tp .ch button:hover{transform:translateY(-2px)}

  crumb(st.mf?"Activity 2":"The Great Food Face-Off",st.title);
  const sc=score(),mx=Math.max(1,sc[0],sc[1]);
  const subs={"Round 1 · Everyday Surprises":"Foods you think you know.","Round 2 · Dessert Dilemmas":"Sweet treats. Surprising comparisons.","Round 3 · Food Traps":"Look beyond the label.","Final Challenge":"Three choices. One final decision."};
  view.innerHTML=`<div class="screen center"><div class="kicker">${st.mf?"Activity 2":"Get ready"}</div><h1 class="roundtitle">${st.title}</h1><div class="roundsub">${st.sub||subs[st.title]||""}</div>
  ${st.showRace?`<div class="race"><div class="bar b1"><div class="lab">${S.names[0]}</div><div class="track"><div class="fill" id="f1"></div></div><div class="num">${sc[0]}</div></div><div class="bar b2"><div class="lab">${S.names[1]}</div><div class="track"><div class="fill" id="f2"></div></div><div class="num">${sc[1]}</div></div></div>`:""}</div>`;
  if(st.showRace) setTimeout(()=>{const a=document.getElementById("f1"),b2=document.getElementById("f2");if(!a||!b2)return;a.style.width=(sc[0]/mx*100)+"%";b2.style.width=(sc[1]/mx*100)+"%";},100);
  host.innerHTML=nav();
}
function picks(idx,r){let h="";if(r.a[0]===idx)h+=`<span class="pick p1">1</span>`;if(r.a[1]===idx)h+=`<span class="pick p2">2</span>`;return `<div class="picks">${h}</div>`;}
function fo(st){
  const q=FO[st.i],r=rec(),rev=S.revealed[key()];
  crumb(q.r,"Food Face-Off · Question "+String(st.i+1).padStart(2,"0"));
  const L=["A","B","C"];
  let cards=q.opts.map((o,i)=>`<div class="card ${rev?(i===q.correct?"win":"dim"):""} ${rev?"show":""}" onclick="setA(0,${i})" oncontextmenu="event.preventDefault();setA(1,${i})" style="cursor:pointer">${picks(i,r)}${picHTML(st,i,q.pics[i])}<div class="letter">${L[i]}</div><div class="label">${o}</div><div class="val">${q.vals[i]}</div></div>`).join("");
  if(!q.three) cards+=`<div class="card ${rev?(q.correct===2?"win":"dim"):""}" onclick="setA(0,2)" oncontextmenu="event.preventDefault();setA(1,2)" style="cursor:pointer">${picks(2,r)}${picHTML(st,2,"⚖️")}<div class="letter">C</div><div class="label">Almost Equal / Depends</div></div>`;
  const labels=["A","B","C"],subs=q.three?q.opts:[q.opts[0],q.opts[1],"Almost Equal"];
  view.innerHTML=`<div class="screen qgrid">${panel(0,labels,subs,r,rev,true,q.correct)}<div class="qmid"><div class="kicker">${q.three?"Final challenge":"Which has more…"}</div><h2 class="q">${q.three?"Which has":"Which has more"} <em>${q.ask}</em>?</h2>
  ${rev?`<div class="tag">${q.tag}</div>`:""}
  <div class="cards">${cards}</div>
  <div class="portion">Portions: ${q.portion}</div>
  ${rev?`<div class="take">${q.take}<small>Remember: “higher carbohydrate” does not automatically mean “less healthy”.</small></div>`:`<div class="revealbtn"><div><button onclick="reveal()">REVEAL</button><small>or press Space</small></div></div>`}</div>${panel(1,labels,subs,r,rev,true,q.correct)}</div>`;
  hostAnswers(["A","B","C"],r,rev,true);
  if(!rev) timerStart(60);
}
function mf(st){
  const q=MF[st.i],r=rec(),rev=S.revealed[key()];
  crumb("Myth or Fact?","Statement "+String(st.i+1).padStart(2,"0")+" of 10");
  const labels=["A","B"],subs=["Myth","Fact"];
  view.innerHTML=`<div class="screen qgrid">${panel(0,labels,subs,r,rev,false,q.a)}<div class="qmid mfmid"><div class="kicker">Myth or Fact? · pick one and give a reason</div><div class="mfhead"><div class="mfimg"><img src="img/mf${st.i}.jpg" alt=""></div><h2 class="q mfq">“${q.s}”</h2></div>
  <div class="mf">
   <div class="card ${rev?(q.a===0?"win":"dim"):""}" onclick="setA(0,0)" oncontextmenu="event.preventDefault();setA(1,0)" style="cursor:pointer">${picks(0,r)}${picHTML(st,0,"❌")}<div class="letter">A</div><div class="label">MYTH</div></div>
   <div class="card ${rev?(q.a===1?"win":"dim"):""}" onclick="setA(0,1)" oncontextmenu="event.preventDefault();setA(1,1)" style="cursor:pointer">${picks(1,r)}${picHTML(st,1,"✅")}<div class="letter">B</div><div class="label">FACT</div></div>
  </div>
  ${rev?`<div class="take">${q.why}<small>Key principle: diabetes awareness should be accurate, supportive and free from blame.</small></div>`:`<div class="revealbtn"><div><button onclick="reveal()">REVEAL</button><small>or press Space</small></div></div>`}</div>${panel(1,labels,subs,r,rev,false,q.a)}</div>`;
  hostAnswers(["A","B"],r,rev,false);
  if(!rev) timerStart(60);
}
function panel(t,labels,subs,r,rev,isFO,correct){
  const cls=t===0?"t1p":"t2p";
  let h=`<div class="tp ${cls}"><h3>${S.names[t]}</h3><div class="ch">`;
  labels.forEach((l,i)=>h+=`<button class="${r.a[t]===i?"on":""}" onclick="setA(${t},${i})">${l}${subs[i]?`<small>${subs[i]}</small>`:""}</button>`);
  h+=`</div>`;
  if(rev){const ok=r.a[t]===correct;let pts=0;if(ok)pts=1;if(r.b[t])pts+=1;
    h+=`<button class="bonus ${r.b[t]?"on":""}" onclick="setB(${t})">${r.b[t]?"★ Bonus added":"☆ Bonus +1"}</button>`;
    h+=`<div class="res ${ok?"ok":"no"}">${ok?"✔ Correct":"✘ Wrong"} · +${pts}</div>`;}
  return h+`</div>`;
}
function hostAnswers(labels,r,rev,isFO){
  let h=`<span class="hint">1 point per correct answer · after reveal: ★ Bonus +1 per team</span><span class="sp"></span><button class="ghost" id="rst" onclick="askReset(this)">↺ Reset quiz</button><button class="ghost" onclick="go(-1)">← Back</button>`;
  h+=rev?`<button class="big" onclick="go(1)">Next →</button>`:`<button class="big" onclick="reveal()">Reveal</button>`;
  h+=`<span class="hint">Space = reveal/next · 1 2 3 / Q W E = answers</span>`;
  host.innerHTML=h;
}
function takeaways(){
  crumb("The Great Food Face-Off","Key takeaways");
  view.innerHTML=`<div class="screen center"><h1 class="title" style="font-size:56px">What did the Face-Off teach us?</h1><div class="takeaways">
  <div><b>1</b><span><b>Total carbs</b> include starches, sugar and fiber.</span></div>
  <div><b>2</b><span>Serving size changes the answer — sometimes dramatically.</span></div>
  <div><b>3</b><span>A label such as “healthy”, “low fat” or “yogurt” doesn’t settle it.</span></div>
  <div><b>4</b><span>Carbohydrate amount alone does NOT define food quality or individual blood-glucose response.</span></div></div></div>`;
  host.innerHTML=nav();
}
function drum(){
  crumb("Team results","And the winner is…");
  const sc=score(),mx=Math.max(1,sc[0],sc[1]);
  view.innerHTML=`<div class="screen center"><div class="drum">Final scores</div>
  <div class="race"><div class="bar b1"><div class="lab">${S.names[0]}</div><div class="track"><div class="fill" id="f1"></div></div><div class="num">${sc[0]}</div></div><div class="bar b2"><div class="lab">${S.names[1]}</div><div class="track"><div class="fill" id="f2"></div></div><div class="num">${sc[1]}</div></div></div>
  <div class="sub" style="margin-top:50px">Press Next for the winner</div></div>`;
  setTimeout(()=>{const a=document.getElementById("f1"),b2=document.getElementById("f2");if(!a||!b2)return;a.style.width=(sc[0]/mx*100)+"%";b2.style.width=(sc[1]/mx*100)+"%";},100);
  host.innerHTML=nav();
}
function winner(){
  crumb("Team results","Knowledge + curiosity = a stronger team");
  const sc=score();let w=sc[0]>sc[1]?0:sc[1]>sc[0]?1:-1;
  view.innerHTML=`<div class="screen center"><div class="circle" style="width:120px;height:120px;border-width:16px;margin-bottom:10px"></div><div class="kicker" style="font-size:22px">And the winner is…</div>
  <div class="winner ${w===0?"c1":w===1?"c2":""}">${w<0?"IT’S A TIE!":S.names[w].toUpperCase()}</div>
  <div class="final">${S.names[0]} ${sc[0]} &nbsp;·&nbsp; ${S.names[1]} ${sc[1]}</div>
  <div class="homework"><b>One thing to do this week:</b> look at the <b>serving size</b> and <b>total carbohydrates</b> on a label.</div></div>`;
  host.innerHTML=`<button class="big" onclick="celebrate()">🎉 Fire again</button>`+nav();
  setTimeout(celebrate,900);
}

/* ---------------- ACTIONS ---------------- */
function setA(t,i){const r=rec();r.a[t]=r.a[t]===i?null:i;render();}
function setC(t,i){rec().c[t]=i;render();}
function setB(t){const r=rec();r.b[t]=!r.b[t];render();if(r.b[t]){confetti(t===0?innerWidth*.12:innerWidth*.88,innerHeight*.5,40,1.0);loop();}}
function reveal(){S.revealed[key()]=true;timerStop();render();const st=steps[S.step];const r=rec();const ok=t=>st.t==="fo"?r.a[t]===FO[st.i].correct:r.a[t]===MF[st.i].a;if(ok(0)||ok(1))burst(ok(0),ok(1));}
function go(d){S.step=Math.max(0,Math.min(steps.length-1,S.step+d));render();}
let rstT=null;function askReset(b){if(b.dataset.arm){clearTimeout(rstT);resetAll();return;}b.dataset.arm=1;b.textContent="Click again to confirm";b.style.borderColor="#D9B23A";b.style.color="#F7D25B";rstT=setTimeout(()=>{delete b.dataset.arm;b.textContent="↺ Reset quiz";b.style.borderColor="";b.style.color="";},3000);}
function resetAll(){S.step=0;S.revealed={};S.ans={};for(const k in TL)delete TL[k];save();render();}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"){if(e.key==="Enter"&&steps[S.step].t==="intro"){e.target.blur();startGame();}return;}
  if(steps[S.step].t==="intro"&&(e.code==="Space"||e.key==="Enter")){e.preventDefault();startGame();return;}
  const st=steps[S.step],isQ=st.t==="fo"||st.t==="mf";
  if(e.code==="Space"){e.preventDefault();if(isQ&&!S.revealed[key()])reveal();else go(1);}
  else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
  else if(isQ){const n=st.t==="fo"?(FO[st.i].three?3:3):2;const m1={"1":0,"2":1,"3":2},m2={q:0,w:1,e:2};
    if(e.key in m1&&m1[e.key]<n)setA(0,m1[e.key]);if(e.key.toLowerCase() in m2&&m2[e.key.toLowerCase()]<n)setA(1,m2[e.key.toLowerCase()]);}
});

/* ---------------- FX: confetti + fireworks ---------------- */
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let P=[];
function rs(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}addEventListener("resize",rs);rs();
const COL=["#1E4FD8","#C9A227","#FFFFFF","#EBCB6A","#4F8BFF","#FFF6D1","#0E2466","#8F6A12"];
function confetti(x,y,n,spread){for(let i=0;i<n;i++){const a=(-Math.PI/2)+(Math.random()-.5)*spread,v=8+Math.random()*10;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.25,w:6+Math.random()*6,h:4+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.3,c:COL[i%COL.length],life:180,type:"c"});}}
function firework(x,y,c){for(let i=0;i<90;i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*7;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.06,r:2+Math.random()*2,c:c||COL[Math.floor(Math.random()*COL.length)],life:70+Math.random()*30,type:"f",drag:.96});}}
function burst(a,b){if(a)confetti(innerWidth*.15,innerHeight*.35,80,1.2);if(b)confetti(innerWidth*.85,innerHeight*.35,80,1.2);loop();}
function celebrate(){
  const W=innerWidth,H=innerHeight;
  confetti(0,H,160,1.0);confetti(W,H,160,1.0);
  for(let i=0;i<8;i++)setTimeout(()=>firework(W*(.15+Math.random()*.7),H*(.15+Math.random()*.4)),i*280+200);
  setTimeout(()=>{confetti(W/2,H*.3,220,2.2);},1800);
  for(let i=0;i<6;i++)setTimeout(()=>firework(W*(.1+Math.random()*.8),H*(.1+Math.random()*.5),i%3===0?"#FFFFFF":i%3===1?"#C9A227":"#4F8BFF"),2600+i*220);
  loop();
}
let running=false;
function loop(){if(running)return;running=true;(function f(){cx.clearRect(0,0,innerWidth,innerHeight);P=P.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of P){p.life--;p.vy+=p.g;if(p.drag){p.vx*=p.drag;p.vy*=p.drag;}p.x+=p.vx;p.y+=p.vy;cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;
    if(p.type==="c"){p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();}
    else{cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();}}
  cx.globalAlpha=1;if(P.length)requestAnimationFrame(f);else{running=false;cx.clearRect(0,0,innerWidth,innerHeight);}})();}

render();
</script>
